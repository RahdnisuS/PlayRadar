name: Wishlist prices
# Every 4 hours: refresh wishlisted games' prices, then email "instant" alerts.
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

concurrency:
  group: db-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_FROM_NAME: PlayRadar
      NEXT_PUBLIC_SITE_URL: https://play-radar-ten.vercel.app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/jobs/poll-wishlist-prices.ts
      - run: npx tsx scripts/jobs/alerts.ts
