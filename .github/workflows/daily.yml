name: Daily catalog refresh
# 21:30 UTC (03:00 India): whole-catalog prices in all regions, release dates, "instant" alerts, then housekeeping.
on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:

concurrency:
  group: db-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_FROM_NAME: PlayRadar
      NEXT_PUBLIC_SITE_URL: https://play-radar-ten.vercel.app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/jobs/refresh-catalog-prices.ts
      - run: npx tsx scripts/jobs/refresh-releases.ts
        if: ${{ !cancelled() }}
      - run: npx tsx scripts/jobs/alerts.ts
        if: ${{ !cancelled() }}
      - run: npx tsx scripts/jobs/housekeeping.ts
        if: ${{ !cancelled() }}
